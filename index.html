<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>纸飞机 · 看谁飞得远</title>
<style>
  :root{
    --accent:#ff8c42;
    --ink:#3a4a6b;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",sans-serif;
    background:#7ec8ff;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  #game{ display:block; width:100vw; height:100vh; touch-action:none; }

  /* 顶部标题 */
  #title{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    font-size:26px; font-weight:bold; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.15), 0 0 12px rgba(255,255,255,.5);
    pointer-events:none; z-index:5; white-space:nowrap;
  }
  #title .plane{ display:inline-block; margin-right:8px; transform:rotate(-10deg); }

  /* 音效开关 */
  #mute{
    position:fixed; top:12px; right:12px; z-index:10;
    width:46px; height:46px; border-radius:50%;
    border:2px solid #fff; background:rgba(255,255,255,.75);
    font-size:22px; cursor:pointer; line-height:1;
  }
  #mute:active{ transform:scale(.92); }

  /* 底部操作提示 */
  #hint{
    position:fixed; left:50%; bottom:8vh; transform:translateX(-50%);
    background:rgba(255,255,255,.92); color:var(--ink);
    font-size:18px; font-weight:bold; padding:12px 20px;
    border-radius:30px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    pointer-events:none; z-index:6; white-space:nowrap;
    animation:bob 1.6s ease-in-out infinite;
  }
  #hint.hidden{ display:none; }
  @keyframes bob{ 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-8px);} }

  /* 结果面板 */
  #result{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; border-radius:26px; padding:28px 34px;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25);
    z-index:20; display:none; min-width:280px;
    border:4px solid #ffd166;
  }
  #result.show{ display:block; animation:pop .35s ease; }
  @keyframes pop{ 0%{ transform:translate(-50%,-50%) scale(.6); opacity:0;} 100%{ transform:translate(-50%,-50%) scale(1); opacity:1;} }
  #result .face{ font-size:52px; }
  #result .msg{ font-size:26px; font-weight:bold; color:var(--ink); margin:6px 0 2px; }
  #result .dist{ font-size:20px; color:#666; margin:6px 0; }
  #result .dist b{ font-size:40px; color:var(--accent); }
  #result .hit{
    font-size:19px; font-weight:bold; margin:2px 0 8px;
    padding:6px 14px; border-radius:20px; display:inline-block;
  }
  #result .hit.ok{ background:#e6ffe6; color:#1a9e3f; }
  #result .hit.miss{ background:#fff2e6; color:#e07b1a; }
  #result .best{ font-size:15px; color:#999; margin-bottom:16px; }
  #result button{
    font-family:inherit; font-size:22px; font-weight:bold; color:#fff;
    background:var(--accent); border:none; border-radius:40px;
    padding:14px 44px; cursor:pointer; box-shadow:0 5px 0 #d96e24;
    transition:transform .08s;
  }
  #result button:active{ transform:translateY(3px); box-shadow:0 2px 0 #d96e24; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title"><span class="plane">✈️</span>纸飞机 · 看谁飞得远</div>
  <button id="mute" title="声音开关">🔊</button>
  <div id="hint">👆 按住屏幕任意处往后拉，让飞机落进地上的圈里！</div>
  <div id="result">
    <div class="face" id="face">🎉</div>
    <div class="msg" id="msg">太棒了！</div>
    <div class="dist">飞了 <b id="dist">0</b> 米</div>
    <div class="hit miss" id="hit">差 0 米</div>
    <div class="best" id="best">🏆 最远纪录：0 米</div>
    <button id="again">再飞一次 🚀</button>
  </div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hintEl = document.getElementById('hint');
  const resultEl = document.getElementById('result');
  const faceEl = document.getElementById('face');
  const msgEl = document.getElementById('msg');
  const distEl = document.getElementById('dist');
  const hitEl = document.getElementById('hit');
  const bestEl = document.getElementById('best');
  const againBtn = document.getElementById('again');
  const muteBtn = document.getElementById('mute');

  // ---------- 全局状态 ----------
  let W = 0, H = 0, dpr = 1, S = 1;          // S: 相对 800px 高度的缩放
  let gravity, maxSpeed, maxDrag, groundY, anchorX, anchorY;

  let state = 'ready';          // ready | dragging | flying | landed
  let wind = 0;                 // 水平风加速度 px/s^2（正=向右）
  let plane = { x:0, y:0, vx:0, vy:0, angle:-0.5, trail:[] };
  let pointer = { active:false, x:0, y:0 };
  let launchDir = { x:1, y:-1 }, launchSpeed = 0, dragDist = 0;
  let distanceMeters = 0;
  let targetX = 0, targetMeters = 0;   // 目标标记物（地面上）
  const HIT_TOLERANCE = 2;             // 差距 2 米内算成功
  let best = loadBest();

  // 安全存取：部分浏览器/微信 webview 可能禁用 localStorage，失败则退回内存值，不让游戏崩
  function loadBest(){
    try{ return parseInt(localStorage.getItem('paper-plane-best') || '0', 10) || 0; }
    catch(e){ return 0; }
  }
  function saveBest(v){
    try{ localStorage.setItem('paper-plane-best', String(v)); }catch(e){}
  }

  let particles = [];   // 落地彩带
  let clouds = [];      // 云朵
  let flowers = [];     // 草地小花
  let lastT = 0;

  // ---------- 音效（WebAudio，简单合成）----------
  let audioCtx = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, when){
    if(muted || !audioCtx) return;
    try{
      const t0 = audioCtx.currentTime + (when || 0);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function soundLaunch(){ tone(300, 0.35, 'triangle', 0.25, 0); tone(150, 0.35, 'triangle', 0.2, 0.02); }
  function soundLand(good){
    if(good){ tone(523,0.14,'sine',0.25,0); tone(659,0.14,'sine',0.25,0.09); tone(784,0.22,'sine',0.25,0.18); }
    else{ tone(330,0.2,'sine',0.2,0); tone(294,0.25,'sine',0.2,0.12); }
  }

  // ---------- 尺寸与缩放 ----------
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    S = H / 800;
    gravity = 1250 * S;
    maxSpeed = 980 * S;
    maxDrag = 170 * S;
    groundY = H * 0.70;
    anchorX = W * 0.30;
    anchorY = groundY - 18;

    resetPlane();
    pickTarget();
    buildDecor();
  }

  function resetPlane(){
    plane.x = anchorX; plane.y = anchorY;
    plane.vx = 0; plane.vy = 0;
    plane.angle = -0.5;
    plane.trail = [];
  }

  function newWind(){
    // 随机风向与风力：负值=向左吹，正值=向右吹
    // 每一局风力差别很大（小风 / 大风 / 阵风都有），增加变数
    const r = Math.random();
    let power;
    if(r < 0.35){        // 小风
      power = Math.random() * 70;
    } else if(r < 0.80){ // 中风
      power = 70 + Math.random() * 90;
    } else {             // 大风/阵风
      power = 160 + Math.random() * 140;
    }
    const dir = Math.random() < 0.5 ? -1 : 1;
    wind = dir * power * S;
  }

  // 本局目标标记物：自动选一个"够得着、但不算太近"的距离
  function pickTarget(){
    const maxMeters = Math.pow(maxSpeed, 2) / gravity / 12;    // 45° 时的理论最远距离（米）
    let m = maxMeters * (0.45 + Math.random() * 0.28);          // 取理论最远的 45%~73%
    m = Math.min(m, (W - anchorX - 14) / 12);                   // 不能飞出屏幕右边
    m = Math.max(m, 12);                                        // 至少 12 米，不能太近
    targetMeters = Math.round(m);
    targetX = anchorX + targetMeters * 12;
  }

  function buildDecor(){
    clouds = [];
    const n = Math.max(3, Math.round(W / 280));
    for(let i=0;i<n;i++){
      clouds.push({ x:Math.random()*W, y:H*(0.1 + Math.random()*0.35), s:0.5 + Math.random()*0.8, sp:6 + Math.random()*10 });
    }
    flowers = [];
    const f = Math.max(6, Math.round(W / 140));
    for(let i=0;i<f;i++){
      flowers.push({ x:Math.random()*W, c:['#ff7eb9','#ffe066','#ff9f68','#b388ff'][Math.floor(Math.random()*4)] });
    }
  }

  function newRound(){
    newWind();
    pickTarget();
    resetPlane();
    state = 'ready';
    distanceMeters = 0;
    hintEl.classList.remove('hidden');
    resultEl.classList.remove('show');
    particles = [];
  }

  // ---------- 物理模拟（用于预览和飞行共用）----------
  function stepProjectile(p, dt){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx += wind * dt;                 // 风
    p.vy += gravity * dt;              // 重力
    // 空气阻力（轻微）
    const damp = Math.pow(0.999, dt * 60);
    p.vx *= damp; p.vy *= damp;
    p.angle = Math.atan2(p.vy, p.vx);
  }

  // ---------- 指针交互 ----------
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function onDown(e){
    ensureAudio();
    if(state === 'ready'){
      pointer.active = true;
      const p = getPos(e);
      pointer.x = p.x; pointer.y = p.y;
      updateDrag();
      state = 'dragging';
      hintEl.classList.add('hidden');
    } else if(state === 'landed'){
      // 点面板按钮重开，这里不处理画布
    }
  }
  function onMove(e){
    if(state !== 'dragging') return;
    const p = getPos(e);
    pointer.x = p.x; pointer.y = p.y;
    updateDrag();
  }
  function onUp(){
    if(state !== 'dragging') return;
    pointer.active = false;
    if(launchSpeed > 80){          // 拉得够远才发射
      plane.x = anchorX; plane.y = anchorY;
      plane.vx = launchDir.x * launchSpeed;
      plane.vy = launchDir.y * launchSpeed;
      plane.angle = Math.atan2(plane.vy, plane.vx);
      plane.trail = [];
      state = 'flying';
      soundLaunch();
    } else {
      // 拉得太轻，退回待命
      resetPlane();
      state = 'ready';
      hintEl.classList.remove('hidden');
    }
  }

  function updateDrag(){
    const dx = anchorX - pointer.x;
    const dy = anchorY - pointer.y;
    const d = Math.hypot(dx, dy);
    if(d < 4){ launchDir = {x:1,y:-1}; launchSpeed = 0; dragDist = 0; plane.x = anchorX; plane.y = anchorY; return; }
    const nx = dx / d, ny = dy / d;          // 发射方向（从手指指向锚点）
    launchDir = { x:nx, y:ny };
    dragDist = Math.min(d, maxDrag);
    launchSpeed = (dragDist / maxDrag) * maxSpeed;
    // 纸飞机被拉到的位置 = 锚点 - 发射方向 * 拉距
    plane.x = anchorX - nx * dragDist;
    plane.y = anchorY - ny * dragDist;
    plane.angle = Math.atan2(ny, nx);
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } else {
    // 旧 iOS / 微信 webview 兜底：触摸 + 鼠标事件
    canvas.addEventListener('touchstart', function(e){ e.preventDefault(); if(e.touches[0]) onDown(e.touches[0]); }, {passive:false});
    canvas.addEventListener('touchmove', function(e){ e.preventDefault(); if(e.touches[0]) onMove(e.touches[0]); }, {passive:false});
    canvas.addEventListener('touchend', function(e){ e.preventDefault(); onUp(); });
    canvas.addEventListener('touchcancel', function(e){ onUp(); });
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  againBtn.addEventListener('click', function(){
    ensureAudio();
    newRound();
  });
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- 落地 ----------
  function land(){
    plane.y = groundY;
    const px = plane.x - anchorX;
    distanceMeters = Math.max(0, Math.round(px / 12));
    const isRecord = distanceMeters > best;
    if(isRecord){ best = distanceMeters; saveBest(best); }

    // 与目标标记物的距离差
    const diffMeters = Math.abs(plane.x - targetX) / 12;
    const hit = diffMeters <= HIT_TOLERANCE;

    // 评级与表情
    let face, msg, good;
    if(hit){ face='🥳'; msg='落进落点啦！'; good=true; }
    else if(distanceMeters >= 70){ face='🏆'; msg='破纪录啦！'; good=true; }
    else if(distanceMeters >= 40){ face='🌟'; msg='太棒了！'; good=true; }
    else if(distanceMeters >= 20){ face='🎉'; msg='好厉害！'; good=true; }
    else if(distanceMeters >= 8){ face='👍'; msg='飞得不错！'; good=true; }
    else { face='💪'; msg='再试一次！'; good=false; }
    if(isRecord && distanceMeters > 0 && !hit){ msg = '🎉 新纪录！'; }

    faceEl.textContent = face;
    msgEl.textContent = msg;
    distEl.textContent = distanceMeters;
    if(hit){
      hitEl.className = 'hit ok';
      hitEl.textContent = '✅ 落点正中（' + targetMeters + ' 米）';
    } else {
      hitEl.className = 'hit miss';
      hitEl.textContent = '差 ' + diffMeters.toFixed(1) + ' 米';
    }
    bestEl.textContent = '🏆 最远纪录：' + best + ' 米';
    resultEl.classList.add('show');

    spawnLandParticles(plane.x, groundY, good);
    soundLand(good);
    state = 'landed';
  }

  function spawnLandParticles(x, y, good){
    const n = good ? 26 : 10;
    for(let i=0;i<n;i++){
      const a = Math.random() * Math.PI * 2;
      const sp = (2 + Math.random() * 5) * S;
      particles.push({
        x, y: y - 6,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2*S,
        g: 900*S, life: 1, decay: 0.9 + Math.random()*1.2,
        c: ['#ff8c42','#ffd166','#ff7eb9','#7ed6ff','#a0e57a'][Math.floor(Math.random()*5)]
      });
    }
  }

  // ---------- 绘制 ----------
  function drawSky(){
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#6ec1ff');
    g.addColorStop(0.7, '#a9dcff');
    g.addColorStop(1, '#d8f0ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY);
  }

  function drawSun(){
    const x = W * 0.88, y = H * 0.13, r = 40 * S;
    const g = ctx.createRadialGradient(x, y, r*0.2, x, y, r*2.2);
    g.addColorStop(0, 'rgba(255,240,150,0.9)');
    g.addColorStop(0.4, 'rgba(255,230,120,0.35)');
    g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r*2.2, y - r*2.2, r*4.4, r*4.4);
    ctx.fillStyle = '#ffdf5e';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  function drawCloud(c){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const s = 26 * S * c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, s, 0, Math.PI*2);
    ctx.arc(c.x + s*0.9, c.y + s*0.2, s*0.75, 0, Math.PI*2);
    ctx.arc(c.x - s*0.9, c.y + s*0.25, s*0.7, 0, Math.PI*2);
    ctx.arc(c.x, c.y - s*0.45, s*0.8, 0, Math.PI*2);
    ctx.fill();
  }

  function drawTarget(){
    const x = targetX, gy = groundY, s = S;
    const rx = HIT_TOLERANCE * 12;              // 落点圈半径 = 2 米（水平投影）
    const ry = Math.max(6*s, rx * 0.30);        // 贴地压扁，看着像地上的圈

    // 落点圈：贴地白色虚线圈（飞机落进这个圈里就算成功）
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, gy + 2*s, rx, ry, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
    ctx.setLineDash([7*s, 6*s]);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3*s;
    ctx.stroke();
    ctx.restore();

    // 小旗子：标出这个落点有多远
    const poleH = 70*s;
    ctx.strokeStyle = '#9a6b3a';
    ctx.lineWidth = 3.5*s;
    ctx.beginPath(); ctx.moveTo(x, gy + ry*0.4); ctx.lineTo(x, gy - poleH); ctx.stroke();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(x, gy - poleH);
    ctx.lineTo(x + 28*s, gy - poleH + 11*s);
    ctx.lineTo(x, gy - poleH + 23*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(x, gy - poleH, 4*s, 0, Math.PI*2); ctx.fill();

    // 距离标签（旗子上方）
    const label = '落点 ' + targetMeters + ' 米';
    ctx.font = 'bold ' + Math.round(15*S+7) + 'px "Comic Sans MS",sans-serif';
    const tw = ctx.measureText(label).width;
    const bh = 26*s;
    const bx = x - tw/2 - 10*s, by = gy - poleH - 30*s - bh, bw = tw + 20*s;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(bx, by, bw, bh, 13*s); }
    else { ctx.rect(bx, by, bw, bh); }
    ctx.fill();
    ctx.fillStyle = '#e0562e';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, by + bh/2 + 1);
    ctx.textBaseline = 'alphabetic';
  }

  function drawGround(){
    const gy = groundY;
    ctx.fillStyle = '#8fd66b';
    ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#a5e37f';
    ctx.fillRect(0, gy, W, 8 * S);
    // 小花
    for(const f of flowers){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(f.x, gy + 16*S, 3*S, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = f.c;
      ctx.beginPath(); ctx.arc(f.x, gy + 14*S, 2.6*S, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPaperPlane(x, y, angle, s){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 阴影（离地越高越淡）
    if(state === 'flying' || state === 'dragging' || state === 'ready'){
      const hgt = Math.max(0, groundY - y);
      const shadowAlpha = Math.max(0, 0.35 - hgt / (H*1.2));
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 阴影不随角度旋转，贴地
      ctx.translate(x, groundY + 8*S);
      ctx.scale(1, 0.35);
      ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha.toFixed(2) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, s*1.3, s*0.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // 机身（白色纸飞机，朝 +x）
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#b9c6dd';
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath();
    ctx.moveTo(s, 0);                       // 机头
    ctx.lineTo(-s*0.95, s*0.55);            // 尾部上翼尖
    ctx.lineTo(-s*0.55, 0);                 // 尾部中央缺口
    ctx.lineTo(-s*0.95, -s*0.55);           // 尾部下翼尖
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 中央折痕
    ctx.strokeStyle = '#c7d3e6';
    ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s*0.55, 0); ctx.stroke();

    // 机头彩条
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(s*0.45, s*0.16); ctx.lineTo(s*0.45, -s*0.16); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawTrajectoryPreview(){
    // 只在拖动且有足够力度时显示轨迹预览
    if(state !== 'dragging' || launchSpeed <= 80) return;
    const sim = { x: anchorX, y: anchorY, vx: launchDir.x*launchSpeed, vy: launchDir.y*launchSpeed, angle:0 };
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const dt = 1/60;
    for(let i=0;i<90;i++){
      stepProjectile(sim, dt);
      if(sim.y >= groundY) break;
      if(i % 3 === 0){
        const a = 1 - i/90;
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(sim.x, sim.y, 4*S, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawLaunchPad(){
    // 发射台：锚点处的虚线圆圈 + 拉弓线
    ctx.save();
    ctx.setLineDash([6*S, 6*S]);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.arc(anchorX, anchorY, 16*S, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    if(state === 'dragging' && launchSpeed > 80){
      // 从纸飞机到锚点的拉力线
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 3*S;
      ctx.beginPath(); ctx.moveTo(plane.x, plane.y); ctx.lineTo(anchorX, anchorY); ctx.stroke();
      // 力度指示
      const pw = (launchSpeed/maxSpeed);
      ctx.fillStyle = 'rgba(255,140,66,0.9)';
      ctx.beginPath(); ctx.arc(anchorX, anchorY, 6*S + pw*10*S, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawWindIndicator(){
    const x = 16, y = H*0.16;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold ' + Math.round(15*S+8) + 'px "Comic Sans MS",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('风', 0, 4);
    // 箭头
    const dir = wind >= 0 ? 1 : -1;
    const wAbs = Math.abs(wind) / S;                    // 换算成"风速值"（去掉屏幕缩放）
    const len = 8 + Math.min(wAbs, 300) / 300 * 26;      // 箭头长度 8~34
    const ax = 32, ay = -2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3*S;
    ctx.beginPath(); ctx.moveTo(ax - dir*len, ay); ctx.lineTo(ax + dir*len, ay); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(ax + dir*len, ay);
    ctx.lineTo(ax + dir*(len-8), ay - 5);
    ctx.lineTo(ax + dir*(len-8), ay + 5);
    ctx.closePath(); ctx.fill();
    // 风力文字：小风 / 中风 / 大风
    const label = wAbs < 70 ? '小风' : (wAbs < 160 ? '中风' : '大风');
    ctx.fillStyle = wAbs >= 160 ? '#ffd166' : 'rgba(255,255,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(label, 78, 5);
    ctx.restore();
  }

  function drawHUD(){
    // 实时距离（飞行中）
    if(state === 'flying'){
      const m = Math.max(0, Math.round((plane.x - anchorX)/12));
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(34*S+10) + 'px "Comic Sans MS",sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 6;
      ctx.fillText(m + ' 米', W/2, H*0.12);
      ctx.shadowBlur = 0;
    }
    // 最远纪录
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.round(14*S+6) + 'px "Comic Sans MS",sans-serif';
    ctx.fillText('🏆 ' + best + ' 米', 16, H*0.09);
  }

  function drawTrail(){
    if(plane.trail.length < 2) return;
    for(let i=0;i<plane.trail.length;i++){
      const t = plane.trail[i];
      const a = i / plane.trail.length;
      ctx.fillStyle = 'rgba(255,255,255,' + (a*0.5).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(t.x, t.y, 2.5*S + a*2.5*S, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += p.g*dt;
      p.life -= p.decay*dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5*S, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 主循环 ----------
  function frame(t){
    const dt = Math.min(0.033, lastT ? (t - lastT)/1000 : 0.016);
    lastT = t;

    // 更新云朵（随风漂移）
    for(const c of clouds){
      c.x += (c.sp + wind*0.03) * dt;
      if(c.x > W + 80) c.x = -80;
      if(c.x < -80) c.x = W + 80;
    }

    if(state === 'flying'){
      stepProjectile(plane, dt);
      plane.trail.push({ x:plane.x, y:plane.y });
      if(plane.trail.length > 42) plane.trail.shift();
      if(plane.y >= groundY) land();
    }

    // 渲染
    drawSky();
    drawSun();
    for(const c of clouds) drawCloud(c);
    drawGround();
    drawTarget();
    drawLaunchPad();
    drawTrajectoryPreview();
    drawTrail();
    drawPaperPlane(plane.x, plane.y, plane.angle, 30*S);
    drawWindIndicator();
    drawHUD();
    drawParticles(dt);

    requestAnimationFrame(frame);
  }

  // ---------- 启动 ----------
  resize();
  newRound();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
