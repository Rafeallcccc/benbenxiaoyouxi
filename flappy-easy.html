<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>纸飞机大冒险 · 宽敞版</title>
<style>
  :root{ --accent:#ff8c42; --ink:#3a4a6b; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",sans-serif;
    background:#7ec8ff; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #game{ display:block; width:100vw; height:100vh; touch-action:none; }

  /* 右上角按钮 */
  #auto, #mic, #mute{
    position:fixed; top:12px; z-index:12;
    width:48px; height:48px; border-radius:50%;
    border:2px solid #fff; background:rgba(255,255,255,.8);
    font-size:22px; cursor:pointer; line-height:1; padding:0;
  }
  #mute{ right:12px; }
  #mic{ right:68px; }
  #auto{ right:124px; }
  #cfg{
    position:fixed; top:12px; right:180px; z-index:12;
    width:48px; height:48px; border-radius:50%;
    border:2px solid #fff; background:rgba(255,255,255,.8);
    font-size:20px; cursor:pointer; line-height:1; padding:0;
  }
  #cfg:active{ transform:scale(.92); }

  /* 灵敏度设置面板 */
  #sheet{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(120%);
    width:min(92vw,420px); background:#fff; border-radius:22px 22px 0 0;
    padding:18px 22px 24px; box-shadow:0 -6px 30px rgba(0,0,0,.22);
    z-index:25; transition:transform .25s ease; text-align:center;
  }
  #sheet.show{ transform:translateX(-50%) translateY(0); }
  #sheet .ttl{ font-size:18px; font-weight:bold; color:var(--ink); margin-bottom:10px; }
  #sheet input[type=range]{
    width:100%; height:36px; -webkit-appearance:none; background:transparent; margin:0;
  }
  #sheet input[type=range]::-webkit-slider-runnable-track{
    height:10px; border-radius:5px;
    background:linear-gradient(90deg,#cfe8ff,#ffd166,#ff6b6b);
  }
  #sheet input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:30px; height:30px; margin-top:-10px;
    border-radius:50%; background:#fff; border:3px solid var(--accent);
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  #sheet .val{ font-size:14px; color:#7b8699; margin:4px 0 14px; line-height:1.6; }
  #sheet .val b{ color:var(--accent); font-size:19px; }
  #sheet button{
    font-family:inherit; font-size:19px; font-weight:bold; color:#fff;
    background:var(--accent); border:none; border-radius:30px;
    padding:11px 40px; box-shadow:0 4px 0 #d96e24;
  }
  #sheet button:active{ transform:translateY(2px); box-shadow:0 2px 0 #d96e24; }
  #auto:active, #mic:active, #mute:active{ transform:scale(.92); }
  #mic.on{ background:#8ef0a8; border-color:#1a9e3f; }
  #auto.on{ background:#c9e8ff; border-color:#2d7ff9; }

  /* 底部提示 */
  #hint{
    position:fixed; left:50%; bottom:14vh; transform:translateX(-50%);
    background:rgba(255,255,255,.94); color:var(--ink);
    font-size:18px; font-weight:bold; padding:12px 22px;
    border-radius:30px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    pointer-events:none; z-index:6; white-space:nowrap; max-width:92vw;
    animation:bob 1.6s ease-in-out infinite;
  }
  #hint.hidden{ display:none; }
  @keyframes bob{ 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-8px);} }

  /* 吹气力度条 */
  #blow{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    width:64%; max-width:340px; height:18px; border-radius:9px;
    background:rgba(255,255,255,.5); border:2px solid #fff;
    overflow:hidden; display:none; z-index:8;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  #blow.show{ display:block; }
  #blow > i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#7ed6ff,#ffd166,#ff6b6b);
    border-radius:9px; transition:width .06s linear;
  }

  /* 浮动提示 */
  #toast{
    position:fixed; left:50%; top:14%; transform:translateX(-50%);
    background:rgba(40,60,90,.88); color:#fff; font-size:16px; font-weight:bold;
    padding:10px 20px; border-radius:24px; z-index:30; pointer-events:none;
    opacity:0; transition:opacity .25s; max-width:88vw; text-align:center; line-height:1.5;
  }
  #toast.show{ opacity:1; }

  /* 结果/过关面板 */
  #panel{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; border-radius:26px; padding:26px 32px;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.28);
    z-index:20; display:none; min-width:280px; max-width:88vw;
    border:4px solid #ffd166;
  }
  #panel.show{ display:block; animation:pop .32s ease; }
  @keyframes pop{ 0%{ transform:translate(-50%,-50%) scale(.6); opacity:0;} 100%{ transform:translate(-50%,-50%) scale(1); opacity:1;} }
  #panel .face{ font-size:54px; line-height:1.1; }
  #panel .msg{ font-size:25px; font-weight:bold; color:var(--ink); margin:6px 0 4px; }
  #panel .sub{ font-size:17px; color:#7b8699; margin:4px 0 18px; white-space:pre-line; line-height:1.6; }
  #panel button{
    font-family:inherit; font-size:22px; font-weight:bold; color:#fff;
    background:var(--accent); border:none; border-radius:40px;
    padding:14px 40px; cursor:pointer; box-shadow:0 5px 0 #d96e24; transition:transform .08s;
  }
  #panel button:active{ transform:translateY(3px); box-shadow:0 2px 0 #d96e24; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="auto" title="吹气自动扇翅膀">🪽</button>
  <button id="mic" title="开启吹气">🎤</button>
  <button id="mute" title="声音开关">🔊</button>
  <button id="cfg" title="吹气灵敏度">⚙️</button>

  <div id="hint">👆 点一下屏幕，纸飞机就会往上飞</div>
  <div id="blow"><i id="blowFill"></i></div>
  <div id="toast"></div>

  <div id="sheet">
    <div class="ttl">吹气灵敏度</div>
    <input id="sens" type="range" min="0.4" max="2" step="0.05" value="0.65">
    <div class="val">当前 <b id="sensVal">0.65</b> 倍<br>一吹就窜天就往左拉，吹不动就往右拉</div>
    <button id="sheetOk">好了</button>
  </div>

  <div id="panel">
    <div class="face" id="pFace">🎉</div>
    <div class="msg" id="pMsg">过关！</div>
    <div class="sub" id="pSub"></div>
    <button id="pBtn">下一关 →</button>
  </div>

<script>
(function(){
  'use strict';

  // ---------- DOM ----------
  var canvas   = document.getElementById('game');
  var ctx      = canvas.getContext('2d');
  var hintEl   = document.getElementById('hint');
  var blowEl   = document.getElementById('blow');
  var blowFill = document.getElementById('blowFill');
  var toastEl  = document.getElementById('toast');
  var autoBtn  = document.getElementById('auto');
  var micBtn   = document.getElementById('mic');
  var muteBtn  = document.getElementById('mute');
  var cfgBtn   = document.getElementById('cfg');
  var sheetEl  = document.getElementById('sheet');
  var sensEl   = document.getElementById('sens');
  var sensValEl= document.getElementById('sensVal');
  var sheetOkBtn = document.getElementById('sheetOk');
  var panelEl  = document.getElementById('panel');
  var pFace    = document.getElementById('pFace');
  var pMsg     = document.getElementById('pMsg');
  var pSub     = document.getElementById('pSub');
  var pBtn     = document.getElementById('pBtn');

  // ---------- 关卡表 ----------
  // gapR    : 缝隙高度（占屏高比例）
  // speedR  : 云柱前进速度（每秒占屏高比例）
  // drift   : 云柱上下浮动幅度（占屏高比例）
  var LEVELS = [
    { gaps: 12, gapR: 0.320, speedR: 0.30, drift: 0.00 },
    { gaps: 14, gapR: 0.290, speedR: 0.34, drift: 0.00 },
    { gaps: 16, gapR: 0.270, speedR: 0.38, drift: 0.07 },
    { gaps: 18, gapR: 0.250, speedR: 0.42, drift: 0.09 },
    // 最后一关：无限关，一直飞到自己撞上为止
    { gaps: Infinity, endless: true, gapR: 0.230, speedR: 0.46, drift: 0.11 }
  ];

  // ---------- 尺寸与派生参数 ----------
  var W = 0, H = 0, dpr = 1, S = 1;
  var groundY = 0, G = 0, flapV = 0, PLANE_X = 0;

  // ---------- 状态 ----------
  var state = 'ready';           // ready | playing | crash | clear | win
  var levelIndex = 0;
  var passed = 0, levelStars = 0, totalStars = loadNum('pp-stars', 0);
  var obstacles = [], particles = [], trail = [], bgClouds = [];
  var speed = 0, spacing = 0, obW = 0, gapH = 0, driftAmp = 0;
  var plane = { x: 0, y: 0, vy: 0, angle: 0 };
  var time = 0, lastT = 0;
  var panelAction = null;
  var cleared = false;

  // ---------- 本地存储（安全版）----------
  function loadNum(k, d){
    try{ var v = parseInt(localStorage.getItem(k) || '', 10); return isNaN(v) ? d : v; }
    catch(e){ return d; }
  }
  function saveNum(k, v){
    try{ localStorage.setItem(k, String(v)); }catch(e){}
  }

  // ---------- 音效 ----------
  var audioCtx = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  }
  function tone(freq, dur, type, vol, when){
    if(muted || !audioCtx) return;
    try{
      var t0 = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function soundFlap(){ tone(700, 0.07, 'sine', 0.16, 0); }
  function soundPass(){ tone(880, 0.07, 'sine', 0.2, 0); tone(1180, 0.09, 'sine', 0.15, 0.06); }
  function soundStar(){ tone(1320, 0.06, 'triangle', 0.18, 0); tone(1760, 0.08, 'triangle', 0.13, 0.05); }
  function soundCrash(){ tone(300, 0.16, 'sawtooth', 0.16, 0); tone(170, 0.26, 'sawtooth', 0.14, 0.09); }
  function soundWin(){ var f = [523, 659, 784, 1046]; for(var i=0;i<f.length;i++){ tone(f[i], 0.16, 'sine', 0.2, i*0.1); } }

  // ---------- 麦克风吹气 ----------
  var micOn = false, micStream = null, analyser = null, micBoost = null;
  var tArr = null, fArr = null, sampleRate = 44100;
  var blow = 0, blowPrev = 0, noiseFloor = 0.005;
  var calibrating = false, calibSum = 0, calibN = 0, calibMin = 1;
  var micLastRms = 0;

  // 自动扇翅膀模式
  var autoFlap = false, autoT = 0;

  // 吹气灵敏度（0.4~2，默认 0.75；嫌太冲往左，吹不动往右）
  var sens = (function(){
    try{
      var v = parseFloat(localStorage.getItem('pp-sens'));
      if(v > 0.3 && v < 3){ return v; }
    }catch(e){}
    return 0.65;
  })();

  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 2600);
  }

  function enableMic(){
    if(micOn) return;
    if(!window.isSecureContext){
      toast('麦克风需要 https 网址才能用\n点屏幕也能玩哦');
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('这个浏览器不支持麦克风\n点屏幕也能玩哦');
      return;
    }
    ensureAudio();
    var wantConstraints = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    var ask;
    try{
      ask = navigator.mediaDevices.getUserMedia({ audio: wantConstraints })
        .catch(function(){ return navigator.mediaDevices.getUserMedia({ audio: true }); });
    }catch(e){
      ask = navigator.mediaDevices.getUserMedia({ audio: true });
    }

    ask.then(function(st){
      micStream = st;
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state !== 'running'){ try{ audioCtx.resume(); }catch(e){} }
      sampleRate = audioCtx.sampleRate;
      var src = audioCtx.createMediaStreamSource(st);
      // 手机麦克风的原始信号很小，先放大 3 倍再分析，否则吹气永远是 0.00x
      micBoost = audioCtx.createGain();
      micBoost.gain.value = 3;
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.3;
      src.connect(micBoost);
      micBoost.connect(analyser);
      // 接一个 0 音量的“沉底”节点，保证部分浏览器/微信里音频图真的在跑，又不会啸叫
      var sink = audioCtx.createGain();
      sink.gain.value = 0;
      analyser.connect(sink);
      sink.connect(audioCtx.destination);
      tArr = new Float32Array(analyser.fftSize);
      fArr = new Float32Array(analyser.frequencyBinCount);
      micOn = true;
      calibrating = true; calibSum = 0; calibN = 0; calibMin = 1; micLastRms = 0;
      micBtn.classList.add('on');
      blowEl.classList.add('show');
      toast('吹气已开启！对着手机用力吹 🫁', 2200);
      setTimeout(checkMic, 2300);
    }).catch(function(err){
      micBtn.classList.remove('on');
      var msg = '麦克风打不开';
      if(err && err.name === 'NotAllowedError') msg = '麦克风权限被拒绝了\n点屏幕也能玩哦';
      else if(err && err.name === 'NotFoundError') msg = '没有找到麦克风\n点屏幕也能玩哦';
      else if(err && err.name === 'NotReadableError') msg = '麦克风被别的程序占用了';
      toast(msg, 3400);
    });
  }

  // 开麦 2 秒后自检一次，让人知道到底有没有吹到
  function checkMic(){
    if(!micOn) return;
    if(micLastRms < 0.005){
      toast('麦克风开着，但几乎没收到声音\n把手机靠近嘴边，对着底部麦克风用力吹', 5200);
    } else {
      toast('麦克风正常 ✓ 现在吹气试试', 2200);
    }
  }

  function bandPower(freq, fromHz, toHz){
    var binHz = sampleRate / analyser.fftSize;
    var a = Math.max(1, Math.floor(fromHz / binHz));
    var b = Math.min(freq.length - 1, Math.ceil(toHz / binHz));
    var sum = 0, n = 0, i, p;
    for(i = a; i <= b; i++){
      p = Math.pow(10, freq[i] / 10);
      sum += p; n++;
    }
    return n > 0 ? sum / n : 0;
  }

  // 返回 0~1 的吹气强度（用"比底噪大多少倍"判断，弱麦克风也玩得动）
  function readBlow(){
    if(!micOn || !analyser) return 0;

    analyser.getFloatTimeDomainData(tArr);
    var sum = 0, i, v, peak = 0;
    for(i = 0; i < tArr.length; i++){
      v = tArr[i]; sum += v * v;
      if(v < 0) v = -v;
      if(v > peak) peak = v;
    }
    var rms = Math.sqrt(sum / tArr.length);
    micLastRms = rms;

    // 开局先听 40 帧环境音，把底噪测出来（取最小值×1.3，开麦时正在吹也测得准）
    if(calibrating){
      calibSum += rms; calibN++;
      if(rms > 0 && rms < calibMin) calibMin = rms;
      if(calibN > 40){
        noiseFloor = Math.max(0.0015, Math.min(calibMin * 1.3, (calibSum / calibN) * 1.5));
        calibrating = false;
      }
      return 0;
    }

    // 底噪慢跟随：安静时往下靠，吹气时基本不动
    if(rms < noiseFloor * 2.2){
      noiseFloor = Math.max(0.0015, noiseFloor * 0.99 + rms * 0.01);
    }

    var ratio = rms / noiseFloor;      // 安静≈1 倍，吹气 5~40 倍
    var s = (ratio - 2.0) / 8;         // 2 倍→0，10 倍→1
    if(peak < 0.006) s = 0;            // 完全没波形起伏 = 没声音

    // 高频成分多 = 更像吹气（只做加成、不做否决，免得永远 0）
    analyser.getFloatFrequencyData(fArr);
    var eLow  = bandPower(fArr, 80, 700);
    var eMid  = bandPower(fArr, 700, 2000);
    var eHigh = bandPower(fArr, 2000, 6500);
    var hiRatio = eHigh / (eLow + eMid + eHigh + 1e-12);
    if(hiRatio > 0.10) s *= 1.15;

    return s > 1 ? 1 : (s < 0 ? 0 : s);
  }

  // ---------- 尺寸 ----------
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    S = H / 800;
    groundY = H * 0.87;
    G = 1.9 * H;            // 重力
    flapV = 0.62 * H;       // 点一下的抬升速度
    PLANE_X = W * 0.28;

    applyLevelMetrics();
    plane.x = PLANE_X;
    if(plane.y < 20 * S || plane.y > groundY - 20 * S){ plane.y = H * 0.45; plane.vy = 0; }
    buildBgClouds();
  }

  function applyLevelMetrics(){
    var L = LEVELS[levelIndex];
    speed    = H * L.speedR;
    spacing  = Math.max(W * 0.82, speed * 1.60);
    gapH     = H * L.gapR;
    obW      = Math.max(54 * S, W * 0.14);
    driftAmp = H * L.drift;
  }

  function buildBgClouds(){
    bgClouds = [];
    var n = Math.max(3, Math.round(W / 260));
    for(var i = 0; i < n; i++){
      bgClouds.push({
        x: Math.random() * W,
        y: H * (0.08 + Math.random() * 0.4),
        s: 0.5 + Math.random() * 0.8,
        sp: 6 + Math.random() * 12
      });
    }
  }

  // ---------- 关卡流程 ----------
  function startLevel(i){
    levelIndex = i;
    applyLevelMetrics();
    obstacles = []; particles = []; trail = [];
    passed = 0; levelStars = 0; cleared = false;
    blow = 0; blowPrev = 0; autoT = 0;
    plane.x = PLANE_X; plane.y = H * 0.45; plane.vy = 0; plane.angle = -0.15;
    spawnObstacle(); spawnObstacle();
    state = 'ready';
    hidePanel();
    hintEl.textContent = autoFlap ? '👆 点一下开始，然后一直吹气' : '👆 点一下屏幕，纸飞机就会往上飞';
    hintEl.classList.remove('hidden');
    if(LEVELS[i].endless){ toast('∞ 无限关开始！能飞多远就飞多远', 2800); }
  }

  function spawnObstacle(){
    var margin = H * 0.10;
    var minC = margin + gapH / 2 + driftAmp;
    var maxC = groundY - margin - gapH / 2 - driftAmp;
    if(maxC < minC){ maxC = minC; }
    var base;
    if(!obstacles.length){
      base = (minC + maxC) / 2;
    } else {
      var last = obstacles[obstacles.length - 1];
      base = last.base + (Math.random() * 2 - 1) * H * 0.22;
    }
    base = Math.max(minC, Math.min(maxC, base));
    var x = obstacles.length ? obstacles[obstacles.length - 1].x + spacing : W + obW;

    obstacles.push({
      x: x, base: base, gapY: base,
      phase: Math.random() * Math.PI * 2,
      passed: false,
      hasStar: Math.random() < 0.8,
      starGot: false
    });
  }

  function flap(){
    plane.vy = Math.min(plane.vy, -flapV);
    soundFlap();
    spawnPuff(plane.x - 10 * S, plane.y + 8 * S);
  }

  function crash(){
    if(state !== 'playing') return;
    state = 'crash';
    soundCrash();
    spawnBurst(plane.x, plane.y, 14);

    var L = LEVELS[levelIndex];
    if(L.endless){
      // 无限关：撞到就是这一轮结束，把捡到的星记进总数
      totalStars += levelStars;
      saveNum('pp-stars', totalStars);
      var bestRun = loadNum('pp-endless-best', 0);
      var isBest = passed > bestRun;
      if(isBest){ bestRun = passed; saveNum('pp-endless-best', bestRun); }
      state = 'win';
      showPanel('🏁', '无限关结束！',
        '这一轮飞过 ' + passed + ' 朵云 · 捡到 ⭐ ' + levelStars +
        '\n' + (isBest ? '🎉 新纪录！' : '最好纪录：' + bestRun + ' 朵云'),
        '💪 再飞一次', function(){ startLevel(levelIndex); });
      return;
    }

    showPanel('💥', '哎呀，撞到啦！', '再来一次，你一定可以的',
      '🔄 再来一次', function(){ startLevel(levelIndex); });
  }

  function levelClear(){
    if(state !== 'playing' || cleared) return;
    cleared = true;
    state = 'clear';
    soundWin();
    totalStars += levelStars;
    saveNum('pp-stars', totalStars);
    spawnBurst(W / 2, H * 0.42, 30);

    var isLast = (levelIndex >= LEVELS.length - 1);
    var nextLv = LEVELS[levelIndex + 1];
    if(isLast){
      state = 'win';
      showPanel('🏆', '全部通关！', '你一共收集了 ⭐ ' + totalStars + ' 颗星',
        '🔁 再玩一次', function(){ totalStars = 0; saveNum('pp-stars', 0); startLevel(0); });
    } else if(nextLv && nextLv.endless){
      showPanel('🎉', '第 ' + (levelIndex + 1) + ' 关通过！',
        '本关收集 ⭐ ' + levelStars + ' 颗\n最后一关是无限关：能飞多远就飞多远！',
        '进入无限关 ∞', function(){ startLevel(levelIndex + 1); });
    } else {
      showPanel('🎉', '第 ' + (levelIndex + 1) + ' 关通过！',
        '本关收集 ⭐ ' + levelStars + ' 颗',
        '下一关 →', function(){ startLevel(levelIndex + 1); });
    }
  }

  function showPanel(face, msg, sub, btn, action){
    pFace.textContent = face;
    pMsg.textContent = msg;
    pSub.textContent = sub;
    pBtn.textContent = btn;
    panelAction = action;
    panelEl.classList.add('show');
  }
  function hidePanel(){
    panelEl.classList.remove('show');
    panelAction = null;
  }

  // ---------- 输入 ----------
  function onDown(e){
    if(e && e.cancelable){ try{ e.preventDefault(); }catch(err){} }
    ensureAudio();

    if(state === 'crash' || state === 'clear' || state === 'win'){
      var a = panelAction;
      hidePanel();
      if(a) a();
      return;
    }
    if(state === 'ready'){
      state = 'playing';
      hintEl.classList.add('hidden');
      flap();
      return;
    }
    if(state === 'playing'){ flap(); }
  }

  if(window.PointerEvent){
    canvas.addEventListener('pointerdown', onDown);
  } else {
    canvas.addEventListener('touchstart', function(e){ if(e.cancelable) e.preventDefault(); onDown(e); }, { passive: false });
    canvas.addEventListener('mousedown', onDown);
  }
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, { passive: false });

  pBtn.addEventListener('click', function(){
    ensureAudio();
    var a = panelAction;
    hidePanel();
    if(a) a();
  });
  micBtn.addEventListener('click', function(){ ensureAudio(); enableMic(); });
  autoBtn.addEventListener('click', function(){
    ensureAudio();
    autoFlap = !autoFlap;
    autoBtn.classList.toggle('on', autoFlap);
    autoT = 0;
    if(autoFlap){
      toast('自动扇翅膀已开\n一直吹气，飞机就会自己往上飞', 3200);
    } else {
      toast('自动扇翅膀已关\n点屏幕 / 吹气都可以', 2400);
    }
    if(state === 'ready'){
      hintEl.textContent = autoFlap ? '👆 点一下开始，然后一直吹气' : '👆 点一下屏幕，纸飞机就会往上飞';
    }
  });
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // 灵敏度设置
  sensEl.value = sens;
  sensValEl.textContent = sens.toFixed(2);
  sensEl.addEventListener('input', function(){
    sens = parseFloat(sensEl.value);
    sensValEl.textContent = sens.toFixed(2);
    try{ localStorage.setItem('pp-sens', String(sens)); }catch(e){}
  });
  cfgBtn.addEventListener('click', function(){
    ensureAudio();
    sheetEl.classList.toggle('show');
  });
  sheetOkBtn.addEventListener('click', function(){
    sheetEl.classList.remove('show');
    toast('灵敏度 ' + sens.toFixed(2) + ' 倍', 1600);
  });

  // ---------- 粒子 ----------
  function spawnPuff(x, y){
    for(var i = 0; i < 4; i++){
      particles.push({
        x: x + Math.random() * 8 * S, y: y + Math.random() * 8 * S,
        vx: -(40 + Math.random() * 60) * S, vy: (Math.random() - 0.5) * 60 * S,
        g: 0, life: 1, decay: 2.2 + Math.random(),
        c: 'rgba(255,255,255,0.9)', r: (3 + Math.random() * 3) * S
      });
    }
  }
  function spawnBurst(x, y, n){
    var cols = ['#ff8c42', '#ffd166', '#ff7eb9', '#7ed6ff', '#a0e57a'];
    for(var i = 0; i < n; i++){
      var ang = Math.random() * Math.PI * 2;
      var sp = (90 + Math.random() * 220) * S;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60 * S,
        g: 900 * S, life: 1, decay: 0.9 + Math.random() * 1.0,
        c: cols[Math.floor(Math.random() * cols.length)],
        r: (4 + Math.random() * 4) * S
      });
    }
  }

  // ---------- 更新 ----------
  function update(dt){
    time += dt;

    // 无限关：飞得越久，云柱稍微快一点点
    if(LEVELS[levelIndex].endless){
      speed = H * (LEVELS[levelIndex].speedR + Math.min(0.12, passed * 0.004));
    }

    // iOS/微信有时会把音频上下文挂起，导致麦克风数据一直是 0，这里反复尝试唤醒
    if(micOn && audioCtx && audioCtx.state === 'suspended'){
      try{ audioCtx.resume(); }catch(e){}
    }

    // 云朵飘
    for(var i = 0; i < bgClouds.length; i++){
      var c = bgClouds[i];
      c.x += c.sp * dt;
      if(c.x > W + 90){ c.x = -90; }
    }

    // 吹气强度始终读取（方便校准和显示力度条）
    var target = readBlow();
    blow = target > blow ? blow + (target - blow) * 0.55 : blow + (target - blow) * 0.18;
    if(micOn){ blowFill.style.width = Math.round(blow * 100) + '%'; }

    if(state !== 'playing'){ blowPrev = blow; return; }

    // 吹气强度 → 实际出力：灵敏度 × 非线性（轻轻吹几乎没劲，用力吹才够）
    var eff = Math.pow(blow, 2.2) * sens;

    if(autoFlap){
      // ===== 自动扇翅膀模式 =====
      // 一直吹气，就按力度自动"扇一下"，不用点屏幕
      if(blow > 0.14){
        autoT += dt;
        var cEff = Math.min(eff, 1.2);
        var interval = 0.62 - 0.22 * cEff;      // 越用力扇得越勤
        if(autoT >= interval){
          autoT = 0;
          var st = 0.55 + 0.45 * cEff;          // 越用力扇得越大
          plane.vy = Math.min(plane.vy, -flapV * st);
          spawnPuff(plane.x - 10 * S, plane.y + 8 * S);
          soundFlap();
        }
      } else {
        autoT = 0;
      }
      // 起吹那一下轻轻托一把
      if(blowPrev < 0.3 && blow >= 0.3){ plane.vy -= flapV * 0.12 * eff; }
    } else {
      // ===== 持续升力模式 =====
      if(blow > 0.05){
        plane.vy -= G * 1.9 * eff * dt;
        if(blowPrev < 0.3 && blow >= 0.3){ plane.vy -= flapV * 0.18 * eff; }
      }
    }
    blowPrev = blow;

    // 物理
    plane.vy += G * dt;
    if(plane.vy > H * 1.15) plane.vy = H * 1.15;
    if(plane.vy < -H * 0.85) plane.vy = -H * 0.85;
    plane.y += plane.vy * dt;

    if(plane.y < 14 * S){ plane.y = 14 * S; if(plane.vy < 0) plane.vy = 0; }

    var ta = plane.vy / (H * 0.9);
    if(ta > 1.15) ta = 1.15;
    if(ta < -0.6) ta = -0.6;
    plane.angle += (ta - plane.angle) * Math.min(1, dt * 12);

    // 尾迹
    trail.push({ x: plane.x, y: plane.y });
    if(trail.length > 22) trail.shift();

    // 云柱
    for(var j = 0; j < obstacles.length; j++){
      var o = obstacles[j];
      o.x -= speed * dt;
      o.gapY = o.base + Math.sin(time * 1.1 + o.phase) * driftAmp;

      if(!o.passed && plane.x > o.x + obW){
        o.passed = true;
        passed++;
        soundPass();
        if(passed >= LEVELS[levelIndex].gaps){ levelClear(); return; }
      }
      if(o.hasStar && !o.starGot){
        var sx = o.x + obW / 2, sy = o.gapY;
        if(Math.abs(plane.x - sx) < 26 * S && Math.abs(plane.y - sy) < 26 * S){
          o.starGot = true; levelStars++; soundStar();
          spawnBurst(sx, sy, 6);
        }
      }
      if(hitObstacle(o)){ crash(); return; }
    }

    while(obstacles.length && obstacles[0].x + obW < -40){ obstacles.shift(); }
    while(!obstacles.length || obstacles[obstacles.length - 1].x < W + spacing){ spawnObstacle(); }

    if(plane.y + 10 * S >= groundY){ crash(); return; }
  }

  function hitObstacle(o){
    var halfW = 12 * S, halfH = 9 * S;
    var left = plane.x - halfW, right = plane.x + halfW;
    var top = plane.y - halfH, bot = plane.y + halfH;
    var oL = o.x + 6 * S, oR = o.x + obW - 6 * S;
    if(right < oL || left > oR) return false;
    var gapTop = o.gapY - gapH / 2 + 12 * S;
    var gapBot = o.gapY + gapH / 2 - 12 * S;
    return (top < gapTop) || (bot > gapBot);
  }

  // ---------- 绘制工具 ----------
  function roundRectPath(x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawSky(){
    var g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#5fb6ff');
    g.addColorStop(0.65, '#a9dcff');
    g.addColorStop(1, '#dff3ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY);
  }

  function drawSun(){
    var x = W * 0.86, y = H * 0.12, r = 38 * S;
    var g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.3);
    g.addColorStop(0, 'rgba(255,245,170,0.95)');
    g.addColorStop(0.4, 'rgba(255,235,130,0.32)');
    g.addColorStop(1, 'rgba(255,235,130,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r * 2.3, y - r * 2.3, r * 4.6, r * 4.6);
    ctx.fillStyle = '#ffdf5e';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawBgClouds(){
    for(var i = 0; i < bgClouds.length; i++){
      var c = bgClouds[i], s = 26 * S * c.s;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.9, c.y + s * 0.2, s * 0.72, 0, Math.PI * 2);
      ctx.arc(c.x - s * 0.9, c.y + s * 0.24, s * 0.68, 0, Math.PI * 2);
      ctx.arc(c.x, c.y - s * 0.45, s * 0.78, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCloudColumn(x, w, y0, y1, edgeBottom){
    var hgt = y1 - y0;
    if(hgt < 2) return;

    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.5, '#f4faff');
    g.addColorStop(1, '#d5e7fb');
    ctx.fillStyle = g;

    var r = Math.min(16 * S, w * 0.28, hgt / 2);
    roundRectPath(x, y0, w, hgt, r);
    ctx.fill();

    var edgeY = edgeBottom ? y1 : y0;
    var bumpR = w * 0.19;
    for(var i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.arc(x + w * (0.22 + i * 0.28), edgeY, bumpR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(140,185,230,0.6)';
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.moveTo(x + 4, edgeY);
    ctx.lineTo(x + w - 4, edgeY);
    ctx.stroke();
  }

  function drawObstacles(){
    for(var i = 0; i < obstacles.length; i++){
      var o = obstacles[i];
      if(o.x > W + 20 || o.x + obW < -20) continue;
      var gapTop = o.gapY - gapH / 2;
      var gapBot = o.gapY + gapH / 2;
      drawCloudColumn(o.x, obW, 0, gapTop, false);
      drawCloudColumn(o.x, obW, gapBot, groundY + 4, true);
    }
  }

  function drawStar(x, y, r, rot){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd93b';
    ctx.fill();
    ctx.strokeStyle = '#e8a800';
    ctx.lineWidth = 2 * S;
    ctx.stroke();
    ctx.restore();
  }

  function drawStars(){
    for(var i = 0; i < obstacles.length; i++){
      var o = obstacles[i];
      if(!o.hasStar || o.starGot) continue;
      if(o.x > W + 30 || o.x + obW < -30) continue;
      drawStar(o.x + obW / 2, o.gapY, 14 * S, time * 2);
    }
  }

  function drawGround(){
    ctx.fillStyle = '#8fd66b';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#a5e37f';
    ctx.fillRect(0, groundY, W, 8 * S);

    var step = 62 * S;
    var off = (time * speed * 0.8) % step;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for(var x = -step - off; x < W + step; x += step){
      ctx.beginPath();
      ctx.arc(x, groundY + 30 * S, 3 * S, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(120,190,90,0.5)';
    for(var x2 = -step - off; x2 < W + step; x2 += step * 1.7){
      ctx.beginPath();
      ctx.arc(x2 + 20 * S, groundY + 52 * S, 5 * S, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTrail(){
    for(var i = 0; i < trail.length; i++){
      var t = trail[i];
      var a = (i / trail.length) * 0.45;
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 2 * S + (i / trail.length) * 3 * S, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWindStreaks(){
    if(blow < 0.15) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + blow * 0.5).toFixed(2) + ')';
    ctx.lineWidth = 2.5 * S;
    for(var i = 0; i < 5; i++){
      var yy = plane.y + (i - 2) * 12 * S;
      var len = (18 + blow * 46) * S;
      var xx = plane.x - 24 * S - i * 6 * S;
      ctx.beginPath();
      ctx.moveTo(xx - len, yy);
      ctx.lineTo(xx, yy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlane(){
    var x = plane.x, y = plane.y, angle = plane.angle, s = 30 * S;

    // 地面影子
    var hgt = Math.max(0, groundY - y);
    var shA = Math.max(0, 0.30 - hgt / (H * 1.3));
    if(shA > 0.01){
      ctx.save();
      ctx.translate(x, groundY + 6 * S);
      ctx.scale(1, 0.32);
      ctx.fillStyle = 'rgba(0,0,0,' + shA.toFixed(2) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, s * 1.1, s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.lineJoin = 'round';

    // 机身
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#b9c6dd';
    ctx.lineWidth = 1.6 * S;
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.lineTo(-s * 0.95, s * 0.55);
    ctx.lineTo(-s * 0.55, 0);
    ctx.lineTo(-s * 0.95, -s * 0.55);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 折痕
    ctx.strokeStyle = '#c7d3e6';
    ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.55, 0); ctx.stroke();

    // 机头彩条
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.lineTo(s * 0.45, s * 0.16);
    ctx.lineTo(s * 0.45, -s * 0.16);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawParticles(dt){
    for(var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.life -= p.decay * dt;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD(){
    var L = LEVELS[levelIndex];
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,70,140,0.35)';
    ctx.shadowBlur = 6;

    ctx.font = 'bold ' + Math.round(16 * S + 8) + 'px "Comic Sans MS","PingFang SC",sans-serif';
    ctx.fillStyle = '#ffffff';
    var progTxt = (L.endless ? ('∞ 无限关  ' + passed + ' 朵') : ('第 ' + (levelIndex + 1) + ' 关  ' + passed + '/' + L.gaps)) + '  · 宽敞版';
    ctx.fillText(progTxt, 16, 40 * S + 14);

    ctx.font = 'bold ' + Math.round(13 * S + 6) + 'px "Comic Sans MS","PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText('⭐ ' + totalStars, 16, 68 * S + 16);

    // 麦克风状态（开了才显示，方便确认到底有没有收到声音）
    if(micOn){
      ctx.font = 'bold ' + Math.round(11 * S + 6) + 'px "Comic Sans MS","PingFang SC",sans-serif';
      ctx.fillStyle = blow > 0.02 ? '#ffd166' : 'rgba(255,255,255,0.8)';
      var micTxt = calibrating ? '🎤 校准中…' : ('🎤 吹气 ' + Math.round(blow * 100) + '%');
      ctx.fillText(micTxt, 16, 92 * S + 18);
    }

    ctx.restore();
  }

  // ---------- 主循环 ----------
  function frame(t){
    var dt = lastT ? (t - lastT) / 1000 : 0.016;
    if(dt > 0.05) dt = 0.05;
    lastT = t;

    update(dt);

    drawSky();
    drawSun();
    drawBgClouds();
    drawObstacles();
    drawStars();
    drawGround();
    drawTrail();
    drawWindStreaks();
    drawPlane();
    drawHUD();
    drawParticles(dt);

    requestAnimationFrame(frame);
  }

  // ---------- 启动 ----------
  resize();
  startLevel(0);
  window.addEventListener('resize', function(){ resize(); }, false);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); }, false);
  requestAnimationFrame(frame);
})();
</script>
</body>
